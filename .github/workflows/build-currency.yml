name: Build Currency Data

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/BOOK_Export_*.tsv'
      - 'tsv/LVLI_Export_*_LVLI_Entries.tsv'
      - 'src/build_currency_json.py'
      - '.github/workflows/build-currency.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Locate latest BOOK Export TSV
        shell: bash
        run: |
          # Pick file with latest Month_Year in filename (mtimes are equal on Actions)
          FILE=$(ls -1 tsv/BOOK_Export_*.tsv 2>/dev/null | grep -iv '_locations' | awk -F'[_./]' '
            BEGIN {
              m["jan"]=1;m["january"]=1;m["feb"]=2;m["february"]=2;
              m["mar"]=3;m["march"]=3;m["apr"]=4;m["april"]=4;
              m["may"]=5;m["jun"]=6;m["june"]=6;m["jul"]=7;m["july"]=7;
              m["aug"]=8;m["august"]=8;m["sep"]=9;m["sept"]=9;m["september"]=9;
              m["oct"]=10;m["october"]=10;m["nov"]=11;m["november"]=11;
              m["dec"]=12;m["december"]=12
            }
            { cm=0;cy=0
              for(i=1;i<=NF;i++){v=tolower($i);if(v in m)cm=m[v];if($i~/^[0-9]{4}$/)cy=$i+0}
              printf "%04d%02d %s\n",cy,cm,$0
            }' | sort -k1,1 | tail -n 1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "ERROR: No BOOK_Export_*.tsv found in tsv/"
            exit 1
          fi
          echo "BOOK_TSV=$FILE" >> $GITHUB_ENV
          echo "Using BOOK TSV: $FILE"

      - name: Locate latest LVLI Entries TSV
        shell: bash
        run: |
          # Pick file with latest Month_Year in filename (mtimes are equal on Actions)
          FILE=$(ls -1 tsv/LVLI_Export_*_LVLI_Entries.tsv 2>/dev/null | awk -F'[_./]' '
            BEGIN {
              m["jan"]=1;m["january"]=1;m["feb"]=2;m["february"]=2;
              m["mar"]=3;m["march"]=3;m["apr"]=4;m["april"]=4;
              m["may"]=5;m["jun"]=6;m["june"]=6;m["jul"]=7;m["july"]=7;
              m["aug"]=8;m["august"]=8;m["sep"]=9;m["sept"]=9;m["september"]=9;
              m["oct"]=10;m["october"]=10;m["nov"]=11;m["november"]=11;
              m["dec"]=12;m["december"]=12
            }
            { cm=0;cy=0
              for(i=1;i<=NF;i++){v=tolower($i);if(v in m)cm=m[v];if($i~/^[0-9]{4}$/)cy=$i+0}
              printf "%04d%02d %s\n",cy,cm,$0
            }' | sort -k1,1 | tail -n 1 | cut -d' ' -f2-)
          echo "LVLI_ENTRIES_TSV=${FILE:-}" >> $GITHUB_ENV
          echo "Using LVLI Entries TSV: ${FILE:-none}"

      - name: Build Currency JSON
        shell: bash
        run: |
          mkdir -p dist
          python src/build_currency_json.py \
            --book-tsv "$BOOK_TSV" \
            ${LVLI_ENTRIES_TSV:+--lvli-entries "$LVLI_ENTRIES_TSV"} \
            --outdir dist

      - name: Sanity check Currency output
        run: |
          test -f dist/currency.json \
            && echo "OK currency.json ($(wc -c < dist/currency.json) bytes)" \
            || (echo "MISSING dist/currency.json" && exit 1)
          python3 -c "
          import json
          d = json.load(open('dist/currency.json'))
          assert 'all_plans' in d, 'Missing all_plans key'
          assert 'slots' in d, 'Missing slots key'
          assert len(d['all_plans']) > 0, 'all_plans is empty'
          assert len(d['slots']) == 24, f'Expected 24 slots, got {len(d[\"slots\"])}'
          print(f'  all_plans: {len(d[\"all_plans\"])}')
          print(f'  minerva plans: {len(d.get(\"minerva\", []))}')
          print(f'  slots: {len(d[\"slots\"])} (big sale: {sum(1 for s in d[\"slots\"] if s[\"big_sale\"])})')
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/currency.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Currency data"
            git fetch origin main
            git pull --rebase origin main
            git push
          fi
