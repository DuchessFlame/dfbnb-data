name: Build Item Finder

# Data Mining > Item Finder (/df/data-mining/item-finder/) and the Member
# Portal Farming List read dist/item_finder/ (a small search index + answer
# shards) through the website's own endpoint — the browser never loads
# plan_master.json.
#
# Runs:
#   * after the plan checklist build and the bugged plans build finish, so the
#     answers always use the newest plan_master and bugged list
#   * when any of its inputs or the builder change — including
#     data/brewmaster_entitlements.json, which Brewmaster commits whenever his
#     entitlement list changes, so new ones reach the page without anyone
#     touching the website
#   * by hand (Actions tab -> Run workflow)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Plan Checklists (How to Obtain)", "Build Current Bugged Plans", "DFBNB Patch Build"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'dist/plan_master.json'
      - 'dist/no_plan_apparel.json'
      - 'dist/titles_camp.json'
      - 'dist/titles_player.json'
      - 'dist/legendary_mods.json'
      - 'dist/unique_weapons_armour/unique_weapons_armour.json'
      - 'dist/bugged_plans.json'
      - 'data/brewmaster_entitlements.json'   # Brewmaster's entitlement list (he commits it)
      - 'src/build_item_finder_json.py'
      - '.github/workflows/build-item-finder.yml'

permissions:
  contents: write

concurrency:
  group: build-item-finder-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (latest main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Item Finder JSON
        run: python src/build_item_finder_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/item_finder
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Item Finder"
            git pull --rebase --autostash origin main
            git push origin main
          fi
