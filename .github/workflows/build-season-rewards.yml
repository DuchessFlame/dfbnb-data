name: Build Season Rewards Data

# Regenerates the curated scoreboard data for every season from the master TSV.
#
# tsv/season_rewards.tsv is the single source of truth for seasons that have
# shipped. build_pts_season_scoreboard.py fills in FUTURE seasons generatively
# from the ENTM export and deliberately skips any season present in that TSV,
# so the two builders never fight over the same file.
#
# Until this workflow existed, build_season_rewards.py was never run in CI:
# dist/calculators/season_tickets_s1..s23.json were orphaned PTS output that got
# overwritten on every patch build, which is why curated images and ticket costs
# for those seasons never survived.

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/season_rewards.tsv'
      - 'tsv/fallout76_seasons.tsv'
      - 'tsv/legacy_seasons.tsv'
      - 'tsv/ENTM_Export_*.tsv'
      - 'src/build_season_rewards.py'
      - 'src/build_season_image_manifests.py'
      - '.github/workflows/build-season-rewards.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build season rewards JSON
        run: |
          mkdir -p dist/calculators
          python src/build_season_rewards.py

      # Joins each season's curated rewards against the ENTM export to produce the
      # per-season texture extraction manifests (dist/season_images/season_{N}_images.json).
      # These tell the local BAE/texconv/avifenc run exactly which .dds to pull and
      # what to name the .avif, so back-filling art for an old season needs no hand-listing.
      - name: Build season image manifests
        run: python src/build_season_image_manifests.py

      - name: Sanity check season rewards output
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          dist = Path("dist/calculators")
          tsv_seasons = set()
          import csv
          with open("tsv/season_rewards.tsv", encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f, delimiter="\t"):
                  n = (row.get("seasonNumber") or "").strip()
                  if n.isdigit():
                      tsv_seasons.add(int(n))

          assert tsv_seasons, "season_rewards.tsv produced no seasons"
          print(f"Seasons in master TSV: {len(tsv_seasons)} "
                f"(S{min(tsv_seasons)}-S{max(tsv_seasons)})")

          problems = []
          for n in sorted(tsv_seasons):
              p = dist / f"season_tickets_s{n}.json"
              if not p.exists():
                  problems.append(f"S{n}: missing {p.name}")
                  continue
              d = json.loads(p.read_text(encoding="utf-8"))
              items = d.get("items") or []
              if not items:
                  problems.append(f"S{n}: zero items")
                  continue
              # Every curated item must be identifiable and placeable.
              #
              # "Placeable" means a page OR a rank. Seasons 1-8 ran on the old
              # 100-rank board game and have no pages at all — demanding a page
              # there would fail the build on correct data.
              #
              # Two kinds of reward sit outside both, and each says so
              # explicitly so that a row saying NOTHING is still an error:
              #   addedInRerun — added when the season was re-released, so it
              #                  was on no original board
              #   unplaced     — curated rows the board list could not place
              #                  (duplicates, colour variants, never shipped)
              no_id = sum(1 for i in items if not i.get("id"))
              no_name = sum(1 for i in items if not (i.get("name") or "").strip())
              no_place = sum(
                  1 for i in items
                  if not str(i.get("page") or "").strip()
                  and not isinstance(i.get("rank"), int)
                  and not i.get("addedInRerun")
                  and not i.get("unplaced")
              )
              if no_id or no_place or no_name:
                  problems.append(
                      f"S{n}: {no_id} without id, {no_place} with neither page "
                      f"nor rank, {no_name} without name")

              # A season is one layout or the other, never a mix — a half-ranked
              # season would render some rewards in the flat rank list and drop
              # the rest into "not placed on the board".
              layout = d.get("layout")
              ranked = sum(1 for i in items if isinstance(i.get("rank"), int))
              paged = sum(1 for i in items if str(i.get("page") or "").strip())
              if layout == "rank" and paged:
                  problems.append(f"S{n}: layout=rank but {paged} items still carry a page")
              if layout == "pages" and ranked:
                  problems.append(f"S{n}: layout=pages but {ranked} items carry a rank")
              if layout == "rank":
                  gaps = [r for r in range(2, (d.get("maxRank") or 0) + 1)
                          if r not in {i.get("rank") for i in items}]
                  if gaps:
                      problems.append(f"S{n}: rank gaps {gaps[:10]}"
                                      + (" …" if len(gaps) > 10 else ""))

              imgs = sum(1 for i in items if i.get("imageUrl"))
              shape = f"ranks 2-{d.get('maxRank')}" if layout == "rank" else f"{paged} paged"
              print(f"  S{n:<2} {len(items):>3} items | {shape:<14} | imageUrl {imgs:>3}")

          allp = dist / "all_seasons.json"
          assert allp.exists(), "missing all_seasons.json"
          allj = json.loads(allp.read_text(encoding="utf-8"))
          print(f"all_seasons.json: {len(allj.get('seasons') or [])} seasons")

          if problems:
              print("\nFAILED:")
              for p in problems:
                  print("  " + p)
              sys.exit(1)
          print("\nOK")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/calculators/season_tickets_s*.json \
                  dist/calculators/all_seasons.json \
                  dist/season_images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Season Rewards data"
            git fetch origin main
            git pull --rebase origin main
            git push
          fi
