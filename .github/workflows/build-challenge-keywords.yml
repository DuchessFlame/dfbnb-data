name: Build Challenge Keyword Finder Data

# /df/score-challenges/challenge-keyword-finder/
# Builds both channels from src/build_challenge_keywords_json.py:
#   live -> dist/challenges/challenge_keywords.json      (reads tsv/ + dist/challenges/challenges.json)
#   PTS  -> dist/pts/challenges/challenge_keywords.json  (reads tsv/pts/ + dist/pts/challenges/challenges.json)
# It reads the challenges.json that build_challenges_json_v3.py writes, so the
# full patch / PTS builds run it straight after the Pre-War Food index (which is
# after Challenges). This one exists so the page can be rebuilt on its own.

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/**'
      - 'dist/challenges/challenges.json'
      - 'dist/pts/challenges/challenges.json'
      - 'src/build_challenge_keywords_json.py'
      # The cut-record rule is imported from the spin wheel builder.
      - 'src/build_spin_wheel_json.py'
      - 'src/tsv_source.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Challenge Keyword Finder (live)
        run: python src/build_challenge_keywords_json.py

      - name: Build Challenge Keyword Finder (PTS)
        # Non-fatal: if tsv/pts/ has no KYWD / FLST / CNDF pull yet, the live
        # page must still publish.
        run: python src/build_challenge_keywords_json.py --pts || echo "PTS build skipped"

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/challenges/challenge_keywords.json
          git add dist/pts/challenges/challenge_keywords.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build Challenge Keyword Finder data"
          git fetch origin main
          git pull --rebase origin main
          git push origin main
