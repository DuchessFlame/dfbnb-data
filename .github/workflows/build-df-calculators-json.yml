name: Build DF Calculators JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pick newest TSVs
        shell: bash
        run: |
          set -e

          newest() {
            ls -1t $1 2>/dev/null | head -n 1
          }

          FLST_TSV="$(newest "tsv/FLST_Export_*.tsv")"
          # Prefer the dedicated SLOTS file; fall back to any ARMO export
          ARMO_TSV="$(newest "tsv/ARMO_Export_*_SLOTS.tsv" 2>/dev/null || newest "tsv/ARMO_Export_*.tsv")"
          ENTM_TSV="$(newest "tsv/ENTM_Export_*.tsv")"
          COBJ_TSV="$(newest "tsv/COBJ_Export_*.tsv")"

          if [ -z "$FLST_TSV" ]; then echo "Missing FLST TSV (tsv/FLST_Export_*.tsv)"; exit 1; fi
          if [ -z "$ARMO_TSV" ]; then echo "Missing ARMO TSV (tsv/ARMO_Export_*_SLOTS.tsv or tsv/ARMO_Export_*.tsv)"; exit 1; fi
          if [ -z "$COBJ_TSV" ]; then echo "Missing COBJ TSV (tsv/COBJ_Export_*.tsv)"; exit 1; fi
          if [ -z "$ENTM_TSV" ]; then echo "Warning: no ENTM TSV found (tsv/ENTM_Export_*.tsv) — backpack & pip-boy skins will be missing"; fi

          echo "FLST_TSV=$FLST_TSV" >> $GITHUB_ENV
          echo "ENTM_TSV=$ENTM_TSV" >> $GITHUB_ENV
          echo "ARMO_BOD2_TSV=$ARMO_TSV" >> $GITHUB_ENV
          echo "COBJ_TSV=$COBJ_TSV" >> $GITHUB_ENV
          echo "SEASONS_TSV=tsv/fallout76_seasons.tsv" >> $GITHUB_ENV

          echo "Using:"
          echo "  FLST_TSV=$FLST_TSV"
          echo "  ARMO_BOD2_TSV=$ARMO_TSV"
          echo "  COBJ_TSV=$COBJ_TSV"
          echo "  ENTM_TSV=$ENTM_TSV"
          echo "  SEASONS_TSV=tsv/fallout76_seasons.tsv"

      - name: Build calculators JSON
        run: node tools/build_df_calculators_json.mjs
        env:
          FLST_TSV: ${{ env.FLST_TSV }}
          ARMO_BOD2_TSV: ${{ env.ARMO_BOD2_TSV }}
          COBJ_TSV: ${{ env.COBJ_TSV }}
          ENTM_TSV: ${{ env.ENTM_TSV }}
          SEASONS_TSV: ${{ env.SEASONS_TSV }}
          OUT_DIR: dist/calculators

      - name: Commit dist changes
        shell: bash
        run: |
          if git status --porcelain dist/calculators/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add dist/calculators/*.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build dist/calculators JSON"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi