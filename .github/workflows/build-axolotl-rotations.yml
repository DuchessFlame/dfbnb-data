name: Build Axolotl Rotations JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build axolotl-rotations.json
        run: node tools/build-axolotl-rotations-json.mjs

      - name: Commit dist changes
        shell: bash
        run: |
          if git status --porcelain | grep -q "^ M dist/axolotl-rotations.json\|^?? dist/axolotl-rotations.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/axolotl-rotations.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build dist/axolotl-rotations.json"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi