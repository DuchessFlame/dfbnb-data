name: Build Bounty Hunting Challenges

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/CHAL_Export_*.tsv'
      - 'src/build_bounty_hunting_json.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:

  # ── Bounty Hunting Challenges JSON (reads CHAL TSV directly — no REHO/events dependency) ──
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Bounty Hunting Challenges JSON
        run: |
          python -V
          python src/build_bounty_hunting_json.py

      - name: Sanity check outputs
        run: |
          test -f dist/challenges/bounty_hunting_challenges.json \
            && echo "OK bounty_hunting_challenges.json" \
            || (echo "MISSING bounty_hunting_challenges.json" && exit 1)

      - name: Commit dist outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            dist/challenges/bounty_hunting_challenges.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Bounty Hunting Challenges JSON"
          git fetch origin main
          git pull --rebase origin main
          git push origin main
