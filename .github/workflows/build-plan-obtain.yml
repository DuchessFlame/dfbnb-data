name: Build Plan Checklists (How to Obtain)

# Builds dist/plan_master.json for the plan-checklist pages
# (apparel / armour / backpack-mod / recipe / weapon), rendered by
# df-bnb-plan-checklists.js -> renderChecklist. Every drop rate is resolved
# with rng76 (src/rng76.py) via spawns_engine — no bare ChanceNone, no
# hardcoded FormIDs. The PTS channel is built separately by dfbnb-pts-build.yml
# (which points --data-dir at the PTS tsvs and relocates dist/ -> dist/pts/).
#
# dfbnb-patch-build.yml now runs this same builder inline on the live channel,
# so a patch build no longer reverts the plan checklists to the previous
# roster. This workflow stays for TSV-only pushes and manual re-runs; both
# entry points call the identical command, so they cannot drift.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tsv/**"
      - "!tsv/pts/**"           # PTS data has its own workflow
      - "src/build_plan_obtain_json.py"
      - "src/rng76.py"
      - "src/spawns_engine/**"
      - "src/build_farming_used_for.py"
      # Enrichers that shape the published rows (recipe/scrap rows, unlock
      # sentences, obtain ledger, New Plans categories). Without these a push
      # that changes only an enricher would not rebuild dist, and the pages
      # would silently serve the old roster — the stale-data footgun the repo's
      # HANDOFF notes already warn about.
      - "src/plan_recipe_rows.py"
      - "src/plan_unlocks.py"
      - "src/plan_sources.py"
      - "src/build_new_plans_json.py"
      - ".github/workflows/build-plan-obtain.yml"

permissions:
  contents: write

concurrency:
  group: build-plan-obtain-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Plan Checklists "How to Obtain" JSON
        run: |
          mkdir -p dist
          python src/build_plan_obtain_json.py \
            --data-dir tsv \
            --outdir dist \
            --report dist/plan_master_unresolved.json
          # Keep src/plan-system/plan_master.json (the copy-source consumed by
          # src/plan-system/build-plan-master.mjs inside the patch/PTS builds) in
          # sync with the real routed output. Without this, the node copy step in
          # those builds reverts dist/plan_master.json back to the old placeholder.
          cp dist/plan_master.json src/plan-system/plan_master.json

      - name: Sanity check output exists
        run: |
          test -f dist/plan_master.json || (echo "Missing dist/plan_master.json" && exit 1)
          python - <<'PY'
          import json
          d = json.load(open("dist/plan_master.json"))
          n = len(d.get("items", []))
          print(f"plan_master.json items: {n}")
          assert n > 0, "no plans built"
          PY

      # New Plans (/df/plan-checklists/new-plans/) rides along with the roster it
      # is a slice of. Whenever plan_master.json is rebuilt here, the newest-vs-
      # previous BOOK diff is rebuilt from the same run, so the two can never
      # disagree about what a given plan's row says.
      #
      # An empty result is valid — two consecutive exports can carry the same
      # plan roster — so this asserts shape, not a minimum count.
      - name: Build New Plans JSON
        run: |
          python src/build_new_plans_json.py \
            --data-dir tsv \
            --outdir dist
          python - <<'PY'
          import json
          d = json.load(open("dist/new_plans.json"))
          total = sum(len(g.get("items", [])) for g in d.get("groups", []))
          assert total == d.get("count"), f"count {d.get('count')} != {total} rows in groups"
          print(f"new_plans.json: {total} new plan(s) "
                f"[{d['baseline']['newest']} vs {d['baseline']['previous']}]")
          PY

      - name: Show dist outputs (debug)
        run: |
          ls -la dist/plan_master.json dist/plan_master_unresolved.json dist/new_plans.json || true
          wc -c dist/plan_master.json || true

      - name: Commit dist output
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/plan_master.json dist/plan_master_unresolved.json dist/new_plans.json src/plan-system/plan_master.json
            git diff --cached --quiet && echo "No changes staged." && exit 0
            git commit -m "Build plan_master.json (plan checklists How-to-Obtain)"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes."
          fi
