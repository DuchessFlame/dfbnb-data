name: Build Bundles JSON

on:
  push:
    branches: [main]
    paths:
      - 'src/bundles.json'
      - 'src/build_bundles.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pull latest (rebase)
        run: |
          git fetch origin
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate and build bundles.json
        run: python src/build_bundles.py

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/bundles.json
          git diff --cached --quiet || git commit -m "chore: build bundles.json [skip ci]"
          git push
