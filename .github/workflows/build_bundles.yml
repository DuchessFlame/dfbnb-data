name: Build Bundles JSON

on:
  push:
    branches: [main]
    paths:
      - 'src/bundles.json'
      - 'scripts/build_bundles.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest (rebase)
        run: |
          git fetch origin
          git pull --rebase origin main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate and build bundles.json
        run: node scripts/build_bundles.js

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/bundles.json
          git diff --cached --quiet || git commit -m "chore: build bundles.json [skip ci]"
          git push
