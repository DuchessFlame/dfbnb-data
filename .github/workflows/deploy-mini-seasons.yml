name: Deploy Mini Seasons JSON

# Verifies that dist/mini_seasons/mini_seasons.json is committed on main
# and available via raw.githubusercontent.com. No SFTP — the site fetches
# the JSON directly from this repo, same as titles / collectables / etc.
#
# Runnable three ways:
#   1. Standalone — workflow_dispatch from the Actions tab.
#   2. Chained from build-mini-seasons.yml via workflow_call.
#   3. Chained from dfbnb-patch-build.yml via workflow_call.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-mini-seasons
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Verify dist file exists
        run: |
          set -e
          F=dist/mini_seasons/mini_seasons.json
          if [ ! -f "$F" ]; then
            echo "ERROR: $F not found on main. Run Build Mini Seasons Data first."
            exit 1
          fi
          BYTES=$(wc -c < "$F")
          echo "OK: $F ($BYTES bytes) is committed on main."
          echo "Live URL: https://raw.githubusercontent.com/${{ github.repository }}/main/$F"

      - name: Confirm deployment
        run: echo "mini_seasons.json is live — served directly from GitHub via raw.githubusercontent.com"
