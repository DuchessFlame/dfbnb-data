name: Build Menu Items

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/menu-overrides.tsv'
      - 'tsv/COBJ_Export_*.tsv'
      - 'src/build_menu_items_json.py'
      - 'src/build_cobj_recipes_json.py'
      - 'src/diagnostics.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebuild COBJ recipes (source of truth)
        run: |
          mkdir -p dist
          python src/build_cobj_recipes_json.py

      - name: Build menu items from COBJ + overrides
        run: python src/build_menu_items_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build menu items + diagnostics"
            git push
          fi
