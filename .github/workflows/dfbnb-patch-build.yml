name: DFBNB Patch Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tsv/**"
      - "tools/**"
      - "src/**"
      - ".github/workflows/dfbnb-patch-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- TITLES ---
      - name: Build Titles JSON
        run: |
          python src/build_titles_json.py \
            --tsv-root tsv \
            --seasons tsv/fallout76_seasons.tsv \
            --outdir dist

      - name: Build Titles Generator JSON
        run: python src/build_titles_generator_json.py

      # --- CURVES ---
      - name: Build Curves JSON
        run: node tools/build_curves_json.mjs

      # --- EVENTS REWARDS ---
      - name: Build Events Rewards JSON
        run: python src/build_events_rewards_json.py

      # --- DF CALCULATORS ---
      - name: Pick newest TSVs (DF Calculators)
        shell: bash
        run: |
          set -e

          newest() {
            ls -1t $1 2>/dev/null | head -n 1
          }

          FLST_TSV="$(newest "tsv/FLST_Export_*.tsv")"
          ARMO_TSV="$(newest "tsv/ARMO_Export_*.tsv")"
          COBJ_TSV="$(newest "tsv/COBJ_Export_*.tsv")"

          if [ -z "$FLST_TSV" ]; then echo "Missing FLST TSV (tsv/FLST_Export_*.tsv)"; exit 1; fi
          if [ -z "$ARMO_TSV" ]; then echo "Missing ARMO TSV (tsv/ARMO_Export_*.tsv)"; exit 1; fi
          if [ -z "$COBJ_TSV" ]; then echo "Missing COBJ TSV (tsv/COBJ_Export_*.tsv)"; exit 1; fi

          echo "FLST_TSV=$FLST_TSV" >> $GITHUB_ENV
          echo "ARMO_BOD2_TSV=$ARMO_TSV" >> $GITHUB_ENV
          echo "COBJ_TSV=$COBJ_TSV" >> $GITHUB_ENV

          echo "Using:"
          echo "  FLST_TSV=$FLST_TSV"
          echo "  ARMO_BOD2_TSV=$ARMO_TSV"
          echo "  COBJ_TSV=$COBJ_TSV"

      - name: Build DF Calculators JSON
        run: node tools/build_df_calculators_json.mjs
        env:
          FLST_TSV: ${{ env.FLST_TSV }}
          ARMO_BOD2_TSV: ${{ env.ARMO_BOD2_TSV }}
          COBJ_TSV: ${{ env.COBJ_TSV }}
          OUT_DIR: dist/calculators

      # --- PLAN MASTER ---
      - name: Build Plan Master JSON
        run: |
          mkdir -p dist
          node src/plan-system/build-plan-master.mjs

      # --- AXOLOTL ---
      - name: Build Axolotl Rotations JSON
        run: node tools/build-axolotl-rotations-json.mjs

      # --- HOME EVENTS ---
      - name: Build Home Events JSON
        run: node tools/build-home-events-json.mjs

      - name: Sanity check dist outputs
        run: |
          ls -la dist || true
          test -f dist/titles_camp.json && echo "OK titles_camp.json" || (echo "Missing titles_camp.json" && exit 1)
          test -f dist/titles_player.json && echo "OK titles_player.json" || (echo "Missing titles_player.json" && exit 1)
          test -f dist/curves/index.json && echo "OK curves/index.json" || (echo "Missing curves/index.json" && exit 1)

      # --- COMMIT ONCE ---
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add dist/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "DFBNB Patch Build update"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi