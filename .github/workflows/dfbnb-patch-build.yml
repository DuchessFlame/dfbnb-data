name: DFBNB Patch Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tsv/**"
      - "tools/**"
      - ".github/workflows/dfbnb-patch-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- TITLES ---
      - name: Build Titles JSON
        run: python tools/build_titles_json.py

      - name: Build Titles Generator JSON
        run: python tools/build_titles_generator_json.py

      # --- CURVES ---
      - name: Build Curves JSON
        run: node tools/build_curves_json.mjs

      # --- EVENTS REWARDS ---
      - name: Build Events Rewards JSON
        run: python tools/build_events_rewards_json.py

      # --- DF CALCULATORS ---
      - name: Build DF Calculators JSON
        run: node tools/build_df_calculators_json.mjs

      # --- PLAN MASTER ---
      - name: Build Plan Master JSON
        run: python tools/build_plan_master_json.py

      # --- AXOLOTL ---
      - name: Build Axolotl Rotations JSON
        run: python tools/build_axolotl_rotations_json.py

      # --- HOME EVENTS ---
      - name: Build Home Events JSON
        run: python tools/build_home_events_json.py

      # --- COMMIT ONCE ---
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add dist/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "DFBNB Patch Build update"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi