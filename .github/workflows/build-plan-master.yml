name: Build plan master JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-plan-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (none)
        run: |
          node -v
          npm -v

      - name: Build dist/plan_master.json
        run: |
          mkdir -p dist
          node src/plan-system/build-plan-master.mjs

      - name: Commit dist output
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/plan_master.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build plan_master.json"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes."
          fi