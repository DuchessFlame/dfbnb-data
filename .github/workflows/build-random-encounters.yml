name: Build Random Encounters Data

# Random encounters have their own builder (split out of the challenges build,
# Sept 2026): src/build_random_encounters_json.py -> dist/random_encounters/.

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/QUEST_Export_*.tsv'
      - 'tsv/GMRW_Export_*.tsv'
      - 'tsv/guide_index.tsv'
      - 'tsv/random_encounter_overrides.tsv'
      - 'src/build_random_encounters_json.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Random Encounters Data
        run: |
          python -V
          python src/build_random_encounters_json.py

      - name: Commit dist outputs
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/random_encounters/random_encounters.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Random Encounters data"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
