name: Build Buffs Data

# Standalone rebuild for /bnb/buffs/*. The master pipeline
# (dfbnb-patch-build.yml) also runs this script, positioned AFTER
# build_recipe_guide_json.py because the How to Obtain routes read
# dist/recipe_guide.json. This workflow assumes that file is already
# committed in dist/ — which it is, on every patch build.

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/**'
      - 'src/build_buffs_json.py'
      # The effect normaliser decides the group names and the
      # SPECIAL-then-A-Z order, so a change to it changes every buff page.
      - 'src/buffs_effects.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run build script
        run: |
          mkdir -p dist/buffs
          python src/build_buffs_json.py --data-dir tsv --outdir dist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Buffs data"
            git push
          fi
