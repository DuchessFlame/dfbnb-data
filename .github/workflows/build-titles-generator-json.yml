name: Build Titles Generator JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build generator JSON
        run: |
          python src/build_titles_generator_json.py

      - name: Commit dist outputs (if changed)
        run: |
          set -e

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add dist/titles_camp_generator.json dist/titles_player_generator.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build titles generator JSON"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi