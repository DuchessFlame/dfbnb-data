name: Build Recipe Guide Data

on:
  workflow_dispatch:

  push:
    paths:
      - 'src/build_recipe_guide_json.py'
      - 'dist/farming_guides.json'
      - 'dist/cobj-recipes.json'
      - 'dist/bnb-item-categories.json'

permissions:
  contents: write

concurrency:
  group: build-recipe-guide
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Recipe Guide Data
        run: |
          mkdir -p dist
          python src/build_recipe_guide_json.py --data-dir tsv --outdir dist

      - name: Commit dist output
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/recipe_guide.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build recipe_guide.json"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes."
          fi
