name: Check Title Art

# Monthly: HEAD-checks the site for every Player / CAMP title picture and
# rebuilds dist/titles/title_art_index.json, so titles switch from their blank
# name tag to the real art once it's uploaded. Run it by hand (Actions ->
# Check Title Art -> Run workflow) straight after an upload to skip the wait.

on:
  schedule:
    - cron: '17 3 1 * *'      # 03:17 UTC on the 1st of every month
  workflow_dispatch:
  push:
    paths:
      - 'src/build_title_art_index.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check title art on the site
        run: python src/build_title_art_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/titles/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Check title art (monthly)"
            git pull --rebase
            git push
          fi
