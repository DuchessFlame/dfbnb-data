name: Build Camp Items JSON

on:
  push:
    branches: [main]
    paths:
      - 'tsv/RESO_Export*.tsv'
      - 'tsv/CONT_Export*.tsv'
      - 'tsv/ENTM_Export*.tsv'
      - 'tsv/COBJ_Export*.tsv'
      - 'tsv/BOOK_Export*.tsv'
      - 'tsv/LVLI_Export*.tsv'
      - 'tsv/GLOB_Export*.tsv'
      - 'src/build_camp_items_json.py'
      - '.github/workflows/build_camp_items.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed for patchlog diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build camp items JSON
        run: |
          python src/build_camp_items_json.py \
            --tsv-root tsv \
            --outdir dist

      - name: Show output summary
        run: |
          echo "=== collectrons.json ==="
          python -c "import json; d=json.load(open('dist/collectrons.json')); print(f'  Items: {d[\"count\"]}')"
          echo "=== resource_producers.json ==="
          python -c "import json; d=json.load(open('dist/resource_producers.json')); print(f'  Items: {d[\"count\"]}')"

      - name: Commit updated dist files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/collectrons.json dist/resource_producers.json
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: rebuild camp items JSON [skip ci]"

      - name: Push changes
        run: git push
