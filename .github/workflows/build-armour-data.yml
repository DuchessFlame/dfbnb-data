name: Build Armour Data

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/COBJ_*.tsv'
      - 'tsv/BOOK_*.tsv'
      - 'src/build_armour_json.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check data files exist
        run: |
          if [ ! -d "tsv" ]; then
            echo "ERROR: tsv/ directory not found."
            exit 1
          fi
          echo "Found TSV files:"
          ls -lh tsv/*.tsv 2>/dev/null || { echo "ERROR: No .tsv files in tsv/"; exit 1; }

      - name: Run build script
        run: |
          mkdir -p dist
          python src/build_armour_json.py --data-dir tsv --out dist/armour.json

      - name: Commit and push dist/armour.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/armour.json
          git diff --cached --quiet || git commit -m "chore: rebuild armour.json [skip ci]"
          git push
