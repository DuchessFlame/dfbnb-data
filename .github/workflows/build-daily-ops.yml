name: Build Daily Ops Data

# Standalone Daily Ops build. Reads the xEdit exports in tsv/ directly - it does
# NOT wait on drop_rates.json or events_rewards.json any more - so it runs on its
# own and a failure anywhere else can't hold it up (or the other way round).
#
# Writes one JSON per page:
#   dist/daily_ops/daily_ops_all_rewards.json       All Rewards page
#   dist/daily_ops/daily_ops_reward_checklist.json  Reward Checklist + Guide pages
#   dist/daily_ops/patchlog_latest_df_daily_ops_rewards.json

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/GMRW_Export_*'
      - 'tsv/LVLI_Export_*'
      - 'tsv/GLOB_Export_*'
      - 'tsv/FLST_Export_*'
      - 'tsv/LCTN_Export_*'
      - 'tsv/BOOK_Export_*'
      - 'tsv/ARMO_Export_*'
      - 'src/build_daily_ops_rewards_json.py'
      - 'src/build_events_rewards_json.py'
      - 'src/events_page_pools.py'
      - 'src/rng76.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Daily Ops JSONs
        run: |
          python -V
          python src/build_daily_ops_rewards_json.py

      - name: Commit dist outputs
        # Runs even if one of the two JSONs failed: the builder only writes the
        # ones that built cleanly, so whatever did build still gets published.
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/daily_ops/daily_ops_all_rewards.json 2>/dev/null || true
          git add dist/daily_ops/daily_ops_reward_checklist.json 2>/dev/null || true
          git add dist/daily_ops/patchlog_latest_df_daily_ops_rewards.json 2>/dev/null || true
          # daily_ops_rewards.json was retired Sept 2026; stage its removal if it is still tracked.
          git rm --cached --ignore-unmatch dist/daily_ops/daily_ops_rewards.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Daily Ops data"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
