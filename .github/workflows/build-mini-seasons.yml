name: Build Mini Seasons Data

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/CHAL_Export_*.tsv'
      - 'tsv/KYWD_Export_*_Refs.tsv'
      - 'tsv/ENTM_Export_*.tsv'
      - 'src/build_mini_seasons_json.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Mini Seasons Data
        run: |
          python -V
          python src/build_mini_seasons_json.py --tsv-root tsv --outdir dist/mini_seasons

      - name: Sanity check output
        run: |
          test -f dist/mini_seasons/mini_seasons.json && echo "OK mini_seasons.json ($(wc -c < dist/mini_seasons/mini_seasons.json) bytes)" || (echo "MISSING mini_seasons.json" && exit 1)

      - name: Commit dist outputs
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/mini_seasons/mini_seasons.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Mini Seasons data"

          git fetch origin main
          git pull --rebase origin main
          git push origin main

  # After a successful build + commit on main, push the fresh JSON up to
  # WP Engine so the live site serves it. Runs via the reusable
  # deploy-mini-seasons.yml workflow so the SFTP logic has a single source
  # of truth.
  deploy:
    needs: build
    uses: ./.github/workflows/deploy-mini-seasons.yml
