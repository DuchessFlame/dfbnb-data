name: Build Seasonal Fish JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build seasonal-fish.json
        run: node tools/build-seasonal-fish-json.mjs

      - name: Commit dist changes
        shell: bash
        run: |
          if git status --porcelain | grep -q "^ M dist/seasonal-fish.json\|^?? dist/seasonal-fish.json"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/seasonal-fish.json
            git diff --cached --quiet && echo "No changes staged." && exit 0

            git commit -m "Build dist/seasonal-fish.json"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
