name: DFBNB Minerva Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - "tsv/BOOK_Export_*.tsv"
      - "src/build_minerva.py"
      - ".github/workflows/dfbnb-minerva-build.yml"

permissions:
  contents: write

jobs:
  build-minerva:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate latest BOOK Export TSV
        shell: bash
        run: |
          FILE=$(ls -1t tsv/BOOK_Export_*.tsv 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No BOOK_Export_*.tsv found in tsv/"
            exit 1
          fi
          echo "BOOK_TSV=$FILE" >> $GITHUB_ENV
          echo "Using BOOK TSV: $FILE"

      - name: Build Minerva Plans JSON
        shell: bash
        run: |
          mkdir -p dist/minerva
          python src/build_minerva.py "$BOOK_TSV" > dist/minerva/minerva_plans.json
          echo "Built dist/minerva/minerva_plans.json"

      - name: Sanity check Minerva output
        run: |
          test -f dist/minerva/minerva_plans.json \
            && echo "OK minerva_plans.json" \
            || (echo "MISSING minerva_plans.json" && exit 1)
          python3 -c "
          import json, sys
          d = json.load(open('dist/minerva/minerva_plans.json'))
          assert 'minerva' in d, 'Missing minerva key'
          assert 'all_plans' in d, 'Missing all_plans key'
          assert len(d['minerva']) > 0, 'minerva list is empty'
          assert len(d['all_plans']) > 0, 'all_plans list is empty'
          print(f'  Minerva plans: {len(d[\"minerva\"])}')
          print(f'  All gold vendor plans: {len(d[\"all_plans\"])}')
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add dist/minerva/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "DFBNB Minerva Build update"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
