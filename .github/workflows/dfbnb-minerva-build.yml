name: DFBNB Minerva Build

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - "tsv/BOOK_Export_*.tsv"
      - "src/build_minerva.py"
      - ".github/workflows/dfbnb-minerva-build.yml"

permissions:
  contents: write

jobs:
  build-minerva:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Locate latest BOOK Export TSV
        shell: bash
        run: |
          # Pick file with latest Month_Year in filename (mtimes are equal on Actions).
          # Excludes companion files (_Locations, _Refs, etc.) by requiring the filename
          # to match BOOK_Export_<Month>_<Year>.tsv with no extra segments after the year.
          newest_by_name() {
            local files
            files=$(ls -1 $1 2>/dev/null | grep -E 'BOOK_Export_[A-Za-z]+_[0-9]{4}\.tsv$')
            [ -z "$files" ] && return
            echo "$files" | awk -F'[_./]' '
            BEGIN {
              m["jan"]=1;m["january"]=1;m["feb"]=2;m["february"]=2;
              m["mar"]=3;m["march"]=3;m["apr"]=4;m["april"]=4;
              m["may"]=5;m["jun"]=6;m["june"]=6;m["jul"]=7;m["july"]=7;
              m["aug"]=8;m["august"]=8;m["sep"]=9;m["sept"]=9;m["september"]=9;
              m["oct"]=10;m["october"]=10;m["nov"]=11;m["november"]=11;
              m["dec"]=12;m["december"]=12
            }
            { cm=0;cy=0
              for(i=1;i<=NF;i++){v=tolower($i);if(v in m)cm=m[v];if($i~/^[0-9]{4}$/)cy=$i+0}
              printf "%04d%02d %s\n",cy,cm,$0
            }' | sort -k1,1 | tail -n 1 | cut -d' ' -f2-
          }

          FILE=$(newest_by_name "tsv/BOOK_Export_*.tsv")
          if [ -z "$FILE" ]; then
            echo "ERROR: No BOOK_Export_<Month>_<Year>.tsv found in tsv/"
            exit 1
          fi
          echo "BOOK_TSV=$FILE" >> $GITHUB_ENV
          echo "Using BOOK TSV: $FILE"

      - name: Build Minerva Plans JSON
        shell: bash
        run: |
          mkdir -p dist/minerva
          python src/build_minerva.py "$BOOK_TSV" > dist/minerva/minerva_plans.json
          echo "Built dist/minerva/minerva_plans.json"

      - name: Sanity check Minerva output
        run: |
          test -f dist/minerva/minerva_plans.json \
            && echo "OK minerva_plans.json" \
            || (echo "MISSING minerva_plans.json" && exit 1)
          python3 -c "
          import json, sys
          d = json.load(open('dist/minerva/minerva_plans.json'))
          assert 'minerva' in d, 'Missing minerva key'
          assert 'all_plans' in d, 'Missing all_plans key'
          assert len(d['minerva']) > 0, 'minerva list is empty'
          assert len(d['all_plans']) > 0, 'all_plans list is empty'
          print(f'  Minerva plans: {len(d[\"minerva\"])}')
          print(f'  All gold vendor plans: {len(d[\"all_plans\"])}')
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add dist/minerva/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "DFBNB Minerva Build update"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
