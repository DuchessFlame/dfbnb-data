name: Build Collectables JSON

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tsv/**"
      - "src/build_collectables_json.py"
      - ".github/workflows/build-collectables-json.yml"

permissions:
  contents: write

concurrency:
  group: build-collectables-json-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Collectables JSON
        run: |
          python src/build_collectables_json.py \
            --tsv-root tsv \
            --seasons tsv/fallout76_seasons.tsv \
            --outdir dist

      - name: Show dist outputs (debug)
        run: |
          echo "---- dist listing ----"
          ls -la dist/collectables_*.json || true
          echo "---- file sizes ----"
          find dist -maxdepth 1 -type f -name "collectables_*.json" -print -exec wc -c {} \; || true

      - name: Sanity check outputs exist
        run: |
          test -f dist/collectables_bobbleheads.json || (echo "Missing collectables_bobbleheads.json" && exit 1)
          test -f dist/collectables_plushies.json || (echo "Missing collectables_plushies.json" && exit 1)
          test -f dist/collectables_notes.json || (echo "Missing collectables_notes.json" && exit 1)
          test -f dist/collectables_manifest.json || (echo "Missing collectables_manifest.json" && exit 1)

      - name: Show git status (debug)
        run: |
          echo "---- git status ----"
          git status --porcelain
          echo "---- dist status ----"
          git status --porcelain dist/ || true

      - name: Commit dist
        run: |
          if git status --porcelain dist/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add dist/
            git commit -m "Update Collectables dist outputs"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No dist changes to commit."
          fi
