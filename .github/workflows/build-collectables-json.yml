name: Build Collectables JSON

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tsv/ALCH_Export*.tsv"
      - "tsv/GLOB_Export*.tsv"
      - "tsv/BOOK_Export*.tsv"
      - "tsv/MISC_Export*.tsv"
      - "tsv/GMRW_Export*.tsv"
      - "tsv/KYWD_Export*_Refs.tsv"
      - "tsv/fallout76_seasons.tsv"
      - "src/build_collectables_json.py"
      - ".github/workflows/build-collectables-json.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Collectables JSON
        run: |
          python src/build_collectables_json.py \
            --tsv-root tsv \
            --seasons tsv/fallout76_seasons.tsv \
            --outdir dist

      - name: Sanity check outputs
        run: |
          test -f dist/collectables_bobbleheads.json && echo "OK collectables_bobbleheads.json" || (echo "MISSING collectables_bobbleheads.json" && exit 1)
          test -f dist/collectables_plushies.json    && echo "OK collectables_plushies.json"    || (echo "MISSING collectables_plushies.json" && exit 1)
          test -f dist/collectables_notes.json       && echo "OK collectables_notes.json"       || (echo "MISSING collectables_notes.json" && exit 1)
          test -f dist/collectables_manifest.json    && echo "OK collectables_manifest.json"    || (echo "MISSING collectables_manifest.json" && exit 1)

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"

          git add dist/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build collectables JSON update"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          fi
