name: Build Build Menu Items JSON

# Every CAMP Build Menu object (Utility > Services, Resources > Water,
# Resources > Producers) that no other CAMP builder covers.
#   live -> dist/build_menu_items.json      (reads tsv/)
#   PTS  -> dist/pts/build_menu_items.json  (reads tsv/pts/)
# The full patch / PTS builds run it too, after the other CAMP builders.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tsv/WORKSHOP_Export_*.json'
      - 'tsv/COBJ*_Export*.tsv'
      - 'tsv/ENTM_Export*.tsv'
      - 'tsv/ACTI_Export*.tsv'
      - 'tsv/FURN_Export*.tsv'
      - 'tsv/CONT_Export*.tsv'
      - 'tsv/LVLI_Export*.tsv'
      - 'tsv/RESO_Export*.tsv'
      - 'tsv/SPEL_Export*.tsv'
      - 'tsv/GLOB_Export*.tsv'
      - 'src/build_build_menu_items_json.py'
      - 'src/camp_build_menu.py'
      - 'src/build_menu.py'
      - 'src/build_camp_items_json.py'
      - '.github/workflows/build-build-menu-items.yml'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Build Menu Items (live)
        run: python src/build_build_menu_items_json.py

      - name: Build Build Menu Items (PTS)
        # Non-fatal: the live page must still publish if tsv/pts/ is thin.
        run: python src/build_build_menu_items_json.py --pts || echo "PTS build skipped"

      - name: Verify camp-items JSON contract
        run: python src/verify_camp_items_json.py --dist dist --allow-missing

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/build_menu_items.json
          git add dist/pts/build_menu_items.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build Build Menu Items data [skip ci]"
          git fetch origin main
          git pull --rebase origin main
          git push origin main
