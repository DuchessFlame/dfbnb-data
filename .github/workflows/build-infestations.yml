name: Build Infestations (HTO) Rewards

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/GLOB_Export_*.tsv'
      - 'tsv/LVLI_Export_*.tsv'
      - 'src/build_hto_rewards_json.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Infestations (HTO) Rewards JSON
        run: |
          python -V
          python src/build_hto_rewards_json.py

      - name: Sanity check output
        run: |
          test -f dist/infestations/hto_rewards.json \
            && echo "OK infestations/hto_rewards.json ($(wc -c < dist/infestations/hto_rewards.json) bytes)" \
            || (echo "MISSING infestations/hto_rewards.json" && exit 1)
          python3 -c "
          import json
          d = json.load(open('dist/infestations/hto_rewards.json'))
          page = d['byPage']['infestations-all-rewards']
          assert page['bossLoot'],    'Missing bossLoot'
          assert page['mobLoot'],     'Missing mobLoot'
          assert page['supportLoot'], 'Missing supportLoot'
          print(f'  Boss pools:    {len(page[\"bossLoot\"])}')
          print(f'  Mob pools:     {len(page[\"mobLoot\"])}')
          print(f'  Support pools: {len(page[\"supportLoot\"])}')
          "

      - name: Commit dist outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/infestations/hto_rewards.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Infestations (HTO) Rewards JSON"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
