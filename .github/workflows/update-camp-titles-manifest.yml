name: Update Camp Titles Manifest (dist commit)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Build titles (manifest)
        run: |
          python src/build_titles.py

      - name: Commit dist outputs (manifest + data)
        shell: bash
        run: |
          if git status --porcelain dist/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Keep it explicit so it doesn't accidentally commit unrelated dist stuff
            git add dist/titles_manifest.json dist/titles_data.json 2>/dev/null || true

            git diff --cached --quiet && echo "No manifest/data changes staged." && exit 0

            git commit -m "Update camp titles manifest"
            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No dist changes."
          fi