name: Build Load Screens Data

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/LSCR_*.tsv'
      - 'src/build_load_screens_json.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check data files exist
        run: |
          if [ ! -d "tsv" ]; then
            echo "ERROR: tsv/ directory not found."
            exit 1
          fi
          echo "Found TSV files:"
          ls -lh tsv/LSCR_*.tsv 2>/dev/null || { echo "ERROR: No LSCR TSV in tsv/"; exit 1; }

      - name: Run build script
        run: |
          mkdir -p dist
          python src/build_load_screens_json.py --data-dir tsv --out dist/load_screens.json

      - name: Commit and push dist/load_screens.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/load_screens.json dist/patchlog_latest_load_screens.json
          git diff --cached --quiet || git commit -m "chore: rebuild load_screens.json [skip ci]"
          git push
