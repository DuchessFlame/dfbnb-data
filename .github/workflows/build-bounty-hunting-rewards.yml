name: Build Bounty Hunting Rewards

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/GLOB_Export_*.tsv'
      - 'tsv/LVLI_Export_*.tsv'
      - 'tsv/NPC_Export_*.tsv'
      - 'tsv/FLST_Export_*.tsv'
      - 'tsv/LCTN_Export_*.tsv'
      - 'tsv/QUST2_Export_*.tsv'
      - 'tsv/CHAL_Export_*.tsv'
      - 'src/build_bounty_hunting_rewards_json.py'
      - 'src/build_bounty_grunt_guides_json.py'
      - 'src/bounty_trees.py'
      - 'src/rng76.py'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Bounty Hunting Rewards JSON
        run: |
          python -V
          python src/build_bounty_hunting_rewards_json.py

      # Grunt Hunt guide facts (locations, support enemies, star tiers). On live
      # it writes no Skyline Valley page until the update ships.
      - name: Build Grunt Hunt Guides JSON
        run: python src/build_bounty_grunt_guides_json.py

      - name: Sanity check output
        run: |
          test -f dist/bounty-hunting/bounty_hunting_rewards.json \
            && echo "OK bounty_hunting_rewards.json ($(wc -c < dist/bounty-hunting/bounty_hunting_rewards.json) bytes)" \
            || (echo "MISSING bounty_hunting_rewards.json" && exit 1)
          python3 -c "
          import json
          d = json.load(open('dist/bounty-hunting/bounty_hunting_rewards.json'))
          for slug, page in d['byPage'].items():
              assert page['eventRewards'], f'Missing eventRewards on {slug}'
              if page.get('hunt') == 'grunt':
                  assert page['outlawLoot'], f'Missing outlawLoot on {slug}'
                  print(f'  {slug}: event pools {len(page[\"eventRewards\"])}, outlaw loot pools {len(page[\"outlawLoot\"])}')
              else:
                  assert page['bossLoot'],     f'Missing bossLoot on {slug}'
                  assert page['mobLoot'],      f'Missing mobLoot on {slug}'
                  assert page['supportLoot'] or page.get('generative'), f'Missing supportLoot on {slug}'
                  print(f'  {slug}: event {len(page[\"eventRewards\"])}, boss {len(page[\"bossLoot\"])}, mob {len(page[\"mobLoot\"])}, support {len(page[\"supportLoot\"])}')
          assert 'grunt-hunt-rewards' in d['byPage'] and 'head-hunt-rewards' in d['byPage']
          "

      - name: Commit dist outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/bounty-hunting/bounty_hunting_rewards.json dist/bounty-hunting/grunt_hunt_guides.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Bounty Hunting Rewards JSON"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
