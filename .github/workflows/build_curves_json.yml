name: Build Curve Tables JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Locate latest CURV points TSV
        shell: bash
        run: |
          FILE=$(ls -1 tsv/CURV_Export_*_POINTS.tsv 2>/dev/null | sort | tail -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No CURV_Export_*_POINTS.tsv found in tsv/"
            exit 1
          fi
          echo "CURV_POINTS_TSV=$FILE" >> $GITHUB_ENV
          echo "Using CURV points TSV: $FILE"

      - name: Build curves JSON
        shell: bash
        run: |
          mkdir -p dist
          CURV_POINTS_TSV="${CURV_POINTS_TSV}" \
          CURV_OUT_DIR="dist/curves" \
          CURV_CHUNK_MAX_CURVES="200" \
          node tools/build_curves_json.mjs

      - name: Commit dist
        shell: bash
        run: |
          if git status --porcelain dist/curves | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dist/curves
            git commit -m "Build curves JSON"

            git fetch origin main
            git pull --rebase origin main
            git push origin main
          else
            echo "No dist/curves changes."
          fi