name: Build Current Bugged Plans

# Standalone run for /df/data-mining/current-bugged-plans/ (and the Data
# Mining > Cut Content data, which reads the same plan_master).
#
# Runs:
#   * after every "Build Plan Checklists (How to Obtain)" run finishes. That
#     workflow runs whenever new game files (tsv/**) are pushed, so the
#     bugged list is always rebuilt AFTER plan_master, on the newest exports.
#     Added 22 Oct 2026: the 21 Oct patch build started before Brewmaster's
#     TSV sync, published a list made from the old files, and nothing rebuilt
#     it afterwards - 13 fixed plans (Tunnel of Love, Windy) stayed "bugged".
#   * when data/bugged_plans_review.json (confirmed / not_a_bug), the Duchess's
#     data/plan_status.json or the builder changes, so a mark shows straight
#     away. A plan_status change is also applied to the live plan_master here
#     (plan_learn_routes, seconds), which then rebuilds the mule pages.
#   * by hand (Actions tab -> Run workflow).
# The monthly patch build (dfbnb-patch-build.yml) still runs it inline too.

on:
  workflow_dispatch:
  workflow_run:
    # The Patch Build also rebuilds plan_master (1 Nov 2026), so the Duchess's
    # calls are re-applied after it too.
    workflows: ["Build Plan Checklists (How to Obtain)", "DFBNB Patch Build"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'data/bugged_plans_review.json'
      - 'data/plan_status.json'
      # A laptop push can carry an older dist/plan_master.json (1 Nov 2026: a
      # GitHub Desktop merge put the pre-call copy back). Re-apply the calls.
      - 'dist/plan_master.json'        # the Duchess's Bugged / Unreleased / Legacy calls (1 Nov 2026)
      - 'src/plan_learn_routes.py'
      - 'src/build_bugged_plans_json.py'
      - 'src/switched_off_starts.py'
      - 'src/build_cut_content_json.py'
      - '.github/workflows/build-bugged-plans.yml'

permissions:
  contents: write

concurrency:
  group: build-bugged-plans-main
  cancel-in-progress: false

jobs:
  build:
    # After a plan checklist build, only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (latest main, so it has the new plan_master)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # the Duchess's calls from Mia (data/plan_status.json, committed by Brewmaster).
      # plan_learn_routes is a pure join over the finished live plan_master
      # (seconds, no rates), so an answer reaches the plan check, the mule
      # lists and the bugged page without the 80-minute build. Live only.
      - name: Apply plan statuses to the live plan_master
        run: |
          python src/plan_learn_routes.py dist/plan_master.json --data-dir tsv
          # only when a row really changed (the checklist stamps the time)
          if ! git diff --quiet dist/plan_master.json; then
            python src/build_make_plan_checklist_json.py
          fi

      - name: Build Current Bugged Plans JSON
        run: |
          mkdir -p dist
          python src/build_bugged_plans_json.py

      - name: Build Cut Content JSON
        run: python src/build_cut_content_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/bugged_plans.json dist/cut_content.json dist/plan_master.json dist/make_plan_checklist.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build Current Bugged Plans"
            git pull --rebase --autostash origin main
            git push origin main
          fi
