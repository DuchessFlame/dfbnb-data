name: Build Raids Data

# Gleaming Depths All Rewards — dist/raids/raids_rewards.json.
#
# This used to chain drop-rates -> events -> raids, because the old builder read
# dist/events/events_rewards.json. It no longer does: build_raids_json.py walks
# the RD01_LL_Raids_Rewards_Enc0N leveled lists straight out of tsv/ with rng76,
# so the only inputs are the TSV exports and dist/legendary_mods.json (for the
# legendary-shard effect text). One job, no cross-workflow dependency.

on:
  workflow_dispatch:

  push:
    paths:
      - 'tsv/**'
      - 'src/build_raids_json.py'
      - 'src/rng76.py'
      - 'dist/legendary_mods.json'

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Pull latest
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify inputs exist
        run: |
          echo "--- newest LVLI entries export ---"
          ls -la tsv/LVLI_Export_*_LVLI_Entries.tsv | tail -1 || echo "NOT FOUND"
          echo "--- legendary_mods.json (shard effect text) ---"
          ls -la dist/legendary_mods.json || echo "NOT FOUND (shards will show no effect text)"

      - name: Build Raids Data
        run: |
          python -V
          python src/build_raids_json.py

      - name: Commit dist outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/raids/raids_rewards.json dist/raids/patchlog_latest_df_raids.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Raids data"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
