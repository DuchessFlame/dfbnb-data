name: Build Fishing JSON

on:
  push:
    branches: [main]
    paths:
      - 'tsv/FISH_Export_*.tsv'
      - 'tsv/GLOB_Export_*.tsv'
      - 'tsv/LVLI_Export_*_LVLI_Entries.tsv'
      - 'tsv/LVLI_Export_*_LVLI_List.tsv'
      - 'src/build_fishing_calculator_json.py'
      - 'tsv/GMRW_Export_*.tsv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pull latest (rebase)
        run: |
          git fetch origin
          git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build fishing.json
        run: python src/build_fishing_calculator_json.py

      - name: Sanity check output
        run: |
          test -f dist/fishing.json || { echo "dist/fishing.json not found"; exit 1; }
          python -c "
          import json, sys
          with open('dist/fishing.json') as f:
              d = json.load(f)
          fish = d.get('fish', [])
          rates = d.get('spawnRates', {})
          globs = d.get('globs', {})
          regions = d.get('regions', [])
          axolotl = d.get('axolotlRotation', [])
          seasonal = d.get('seasonalFish', [])
          wl = d.get('waterloggedGifts', {})
          ws = d.get('weekendSeasonalFish', {})
          errs = []
          if len(fish) < 40:
              errs.append(f'Too few fish: {len(fish)}')
          if len(rates) != 3:
              errs.append(f'Expected 3 weather keys in spawnRates, got {len(rates)}')
          if len(globs) < 30:
              errs.append(f'Too few globs: {len(globs)}')
          if len(regions) < 6:
              errs.append(f'Too few regions: {len(regions)}')
          if len(axolotl) != 12:
              errs.append(f'Expected 12 axolotl months, got {len(axolotl)}')
          if len(seasonal) < 4:
              errs.append(f'Too few seasonal fish: {len(seasonal)}')
          if not wl.get('odds'):
              errs.append('Missing waterloggedGifts odds')
          if not ws.get('odds'):
              errs.append('Missing weekendSeasonalFish odds')
          pe = d.get('whatsBiting', {}).get('publicEvents', [])
          if len(pe) < 30:
              errs.append(f'Too few whatsBiting publicEvents: {len(pe)}')
          if errs:
              for e in errs: print(e, file=sys.stderr)
              sys.exit(1)
          print(f'OK: {len(fish)} fish, {len(regions)} regions, {len(globs)} globs, {len(axolotl)} axolotl months, {len(seasonal)} seasonal fish')
          "

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/fishing.json
          git diff --cached --quiet || git commit -m "chore: build fishing.json [skip ci]"
          git push
