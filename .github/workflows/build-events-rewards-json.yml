name: Build Events Rewards JSON

on:
  workflow_dispatch:
  push:
    paths:
      - "tsv/**"
      - "tools/build_events_rewards_json.py"
      - ".github/workflows/build-events-rewards-json.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Events Rewards JSON
        run: |
          python -V
          python tools/build_events_rewards_json.py

      - name: Commit dist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/events/events_rewards.json dist/events/events_rewards_by_page.json dist/patchlogs/patchlog_latest_df_events.json
          git commit -m "Build Events Rewards JSON" || echo "No changes to commit"
          git push