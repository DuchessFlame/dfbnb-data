name: Build Events Rewards JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-main
  cancel-in-progress: false

jobs:
  # Step 1: Build shared drop rates first
  drop-rates:
    uses: ./.github/workflows/build-drop-rates.yml

  # Step 2: Build events rewards using the shared JSON
  build:
    needs: drop-rates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Pull latest (includes drop_rates.json from previous job)
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify drop_rates.json exists
        run: |
          if [ -f dist/drop_rates.json ]; then
            echo "drop_rates.json found ($(wc -c < dist/drop_rates.json) bytes)"
          else
            echo "Warning: dist/drop_rates.json not found — script will use TSV fallback"
          fi

      - name: Build Events Rewards JSON
        run: |
          python -V
          python src/build_events_rewards_json.py

      - name: Commit dist outputs
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist/events/events_rewards.json dist/events/events_rewards_by_page.json dist/patchlogs/patchlog_latest_df_events.json
          # by_page_slices.py prunes retired slices; -A stages the deletions too,
          # otherwise the prune runs on the runner and is thrown away.
          git add -A dist/events/by_page

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Build Events Rewards JSON"

          git fetch origin main
          git pull --rebase origin main
          git push origin main
